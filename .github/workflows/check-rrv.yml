name: Check Frequent Miler RRVs

# Runs scripts/check_rrv.py once a day: one polite request to Frequent Miler's Reasonable Redemption Values page
# (the source for data/valuations.json), compared against the saved baseline in
# scripts/cardfinder/rrv_check_state.json. See scripts/README.md for what the check itself does.
#
# If the RRV tables changed (or the page could not be read), this job fails on purpose so GitHub's own notification
# for a failed scheduled workflow reaches whoever watches this repo — no extra secrets or services needed. A given
# table change fails once, with the changed rows printed in the log; later runs stay green (and say so) until
# someone compares the change to data/valuations.json and re-runs this workflow by hand with "ack" set to true,
# which accepts the current page as the new baseline. A dateModified bump with identical tables does not fail it,
# and a fetch that fails is retried before it counts.
#
# "ack" also diffs data/valuations.json's cents-per-point values against scripts/cardfinder/last_known_values.json
# (a snapshot as of the last ack) and, for whichever points programs actually moved, adds one line to CHANGELOG.md:
# "Updated the rankings to reflect changes to the value of X." (site owner's rule, 2026-09-22, for consistent
# changelog entries). This only fires from a real, already-made edit to valuations.json — the check itself never
# parses or guesses values from the RRV page, only whether the page looks different at all.

on:
  schedule:
    - cron: "17 13 * * *"   # once daily; an arbitrary time, not the top of the hour
  workflow_dispatch:
    inputs:
      ack:
        description: "Accept the current page as the new baseline (only after reviewing the change by hand)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # to commit the updated baseline file back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"   # the script is standard library only, no requirements.txt needed

      - name: Run the RRV check
        id: check
        run: |
          set +e
          if [ "${{ github.event.inputs.ack }}" = "true" ]; then
            python3 scripts/check_rrv.py --ack
          else
            python3 scripts/check_rrv.py
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit the updated baseline, if it changed
        run: |
          files="scripts/cardfinder/rrv_check_state.json scripts/cardfinder/rrv_check_rows.txt scripts/cardfinder/last_known_values.json CHANGELOG.md"
          if ! git diff --quiet -- $files; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $files
            git commit -m "check_rrv: update saved baseline"
            git push
          fi

      - name: Fail the job if the page changed or could not be read
        if: steps.check.outputs.exit_code != '0'
        run: exit ${{ steps.check.outputs.exit_code }}
