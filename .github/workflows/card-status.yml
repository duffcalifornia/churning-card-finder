name: Card status reply

# Handles the owner's reply to a "Card not found: ..." issue opened by refresh-offers.yml. Reply with:
#   /discontinued   the card can no longer be applied for: it is added to
#                   scripts/cardfinder/discontinued_cards.json, dropped from data/cards.json, a changelog line is
#                   added, the change is committed, and the issue is closed.
#   /still-active   the card can still be applied for (the scraper just cannot find it): the issue is labelled and
#                   closed, and the same card is not raised again for 30 days. Its last known data stays on the site.
# Both work from the GitHub mobile app; nothing needs a computer. See scripts/apply_card_status.py.
#
# Safety: this is a public repo, so anyone can comment. A comment only counts if its author has write access to the
# repo. Comment and issue text reach the scripts through environment variables, never spliced into a shell command.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# Shared with refresh-offers.yml: both push data commits to main, so they must not overlap.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'card-missing') &&
      (startsWith(github.event.comment.body, '/discontinued') || startsWith(github.event.comment.body, '/still-active'))
    runs-on: ubuntu-latest
    steps:
      - name: Check the commenter has write access
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENTER/permission" --jq .permission || echo none)
          case "$permission" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT"; echo "Ignoring $COMMENTER (permission: $permission)" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.auth.outputs.allowed == 'true'

      - uses: actions/setup-python@v5
        if: steps.auth.outputs.allowed == 'true'
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        if: steps.auth.outputs.allowed == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Work out what was asked
        id: apply
        if: steps.auth.outputs.allowed == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/apply_card_status.py

      - name: Run the test suite against the rebuilt data
        id: verify
        if: steps.auth.outputs.allowed == 'true' && steps.apply.outputs.changed == 'true'
        run: |
          set +e
          python3 -m unittest discover -s scripts/tests -t scripts 2>&1 | tee test.log
          echo "test_exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit and close - /discontinued
        if: steps.auth.outputs.allowed == 'true' && steps.apply.outputs.changed == 'true' && steps.verify.outputs.test_exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CARD_NAME: ${{ steps.apply.outputs.card_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data scripts/cardfinder docs CHANGELOG.md
          git commit -m "Remove $CARD_NAME: can no longer be applied for"
          git push
          gh issue comment "${{ github.event.issue.number }}" --body "Done. $CARD_NAME is removed from the site and the changelog has a line for it. The site updates once the change deploys."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Tests failed - nothing committed
        if: steps.auth.outputs.allowed == 'true' && steps.apply.outputs.changed == 'true' && steps.verify.outputs.test_exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Removing this card made the test suite fail, so nothing was committed and this issue stays open. [Full run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          exit 1

      - name: Already removed - /discontinued
        if: steps.auth.outputs.allowed == 'true' && steps.apply.outputs.command == 'discontinued' && steps.apply.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Nothing to change: this card is already removed (or its id is not recognised)."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Label and close - /still-active
        if: steps.auth.outputs.allowed == 'true' && steps.apply.outputs.command == 'still-active'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create still-active --color 0E8A16 --description "Owner confirmed the card can still be applied for" --force
          gh issue edit "${{ github.event.issue.number }}" --add-label still-active
          gh issue comment "${{ github.event.issue.number }}" --body "Noted: the card is still available. Its last known offer stays on the site, and it will not be raised again for 30 days."
          gh issue close "${{ github.event.issue.number }}" --reason "not planned"
