name: Card status reply

# Handles the owner's reply to a review issue opened by refresh-offers.yml:
#
#   "Card not found: X"  (label card-missing)
#     /discontinued   the card can no longer be applied for: added to scripts/cardfinder/discontinued_cards.json, dropped
#                     from data/cards.json, changelog line added, committed, issue closed.
#     /still-active   the card can still be applied for (the scraper just cannot find it): labelled and closed, and not
#                     raised again for 30 days. Its last known data stays on the site.
#   "New card found: X"  (label card-new)
#     /track          start tracking it (added to tracked_cards.json, offer and fee seeded from what was read, changelog
#                     line added, committed, closed). Options: kind=business name="Exact Name" currency=<id>. Sent again
#                     later with a currency, it sets the points currency.
#     /ignore         never raise this page again (added to ignored_cards.json).
#
# All of it works from the GitHub mobile app; nothing needs a computer. See scripts/apply_card_status.py, which decides
# what to do and tells the steps below through its outputs.
#
# Safety: this is a public repo, so anyone can comment. A comment only counts if its author has write access to the
# repo. Comment and issue text reach the scripts through environment variables, never spliced into a shell command.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# Shared with refresh-offers.yml: both push data commits to main, so they must not overlap.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.pull_request == null &&
      (contains(github.event.issue.labels.*.name, 'card-missing') || contains(github.event.issue.labels.*.name, 'card-new')) &&
      (startsWith(github.event.comment.body, '/discontinued') || startsWith(github.event.comment.body, '/still-active') ||
       startsWith(github.event.comment.body, '/track') || startsWith(github.event.comment.body, '/ignore'))
    runs-on: ubuntu-latest
    steps:
      - name: Check the commenter has write access
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENTER/permission" --jq .permission || echo none)
          case "$permission" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT"; echo "Ignoring $COMMENTER (permission: $permission)" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.auth.outputs.allowed == 'true'

      - uses: actions/setup-python@v5
        if: steps.auth.outputs.allowed == 'true'
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        if: steps.auth.outputs.allowed == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Work out what was asked
        id: apply
        if: steps.auth.outputs.allowed == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/apply_card_status.py

      - name: Run the test suite against the rebuilt data
        id: verify
        if: steps.auth.outputs.allowed == 'true' && steps.apply.outputs.changed == 'true'
        run: |
          set +e
          python3 -m unittest discover -s scripts/tests -t scripts 2>&1 | tee test.log
          echo "test_exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit the change
        if: steps.auth.outputs.allowed == 'true' && steps.apply.outputs.changed == 'true' && steps.verify.outputs.test_exit_code == '0'
        env:
          MESSAGE: ${{ steps.apply.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data scripts/cardfinder docs CHANGELOG.md
          git commit -m "$MESSAGE"
          git push

      - name: Tests failed - nothing committed
        if: steps.auth.outputs.allowed == 'true' && steps.apply.outputs.changed == 'true' && steps.verify.outputs.test_exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "That change made the test suite fail, so nothing was committed and this issue stays open. [Full run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          exit 1

      - name: Reply, label and close
        if: steps.auth.outputs.allowed == 'true' && steps.apply.outputs.command != 'none' && (steps.apply.outputs.changed != 'true' || steps.verify.outputs.test_exit_code == '0')
        env:
          GH_TOKEN: ${{ github.token }}
          REPLY: ${{ steps.apply.outputs.reply }}
          LABEL: ${{ steps.apply.outputs.label }}
          CLOSE_REASON: ${{ steps.apply.outputs.close_reason }}
        run: |
          if [ -n "$LABEL" ]; then
            gh label create "$LABEL" --color 0E8A16 --description "Owner confirmed the card can still be applied for" --force
            gh issue edit "${{ github.event.issue.number }}" --add-label "$LABEL"
          fi
          if [ -n "$REPLY" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "$REPLY"
          fi
          if [ -n "$CLOSE_REASON" ]; then
            gh issue close "${{ github.event.issue.number }}" --reason "$CLOSE_REASON"
          fi
